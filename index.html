<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo 3D Interactivo - Vuelo y Seguimiento</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0f12;
            font-family: sans-serif;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        .ui-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.8);
            padding: 12px 24px;
            border-radius: 30px;
            color: #f8fafc;
            font-size: 14px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .file-loader {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.9);
            padding: 10px 18px;
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .file-loader:hover {
            background: rgba(30, 41, 59, 1);
        }
        .file-loader input {
            display: none;
        }
    </style>
</head>
<body>

    <label class="file-loader">
        📁 Cargar tu modelo (.gltf / .bin)
        <input type="file" id="fileInput" multiple accept=".gltf,.bin,.png,.jpg">
    </label>

    <div id="webgl-container"></div>

    <div class="ui-overlay">
        <span>✨ Mueve el cursor para que te siga</span>
        <span>•</span>
        <span>🖱️ Haz clic para giro 360° aleatorio</span>
    </div>

    <!-- Importamos Three.js y los módulos necesarios mediante ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, model, mixer;
        let clock = new THREE.Clock();
        
        // Variables para el movimiento de vuelo y comportamiento
        let flightTime = 0;
        let targetPosition = new THREE.Vector3();
        
        // Control de giro de 360° por clics
        let isSpinning = false;
        let spinProgress = 0;
        let spinAxis = new THREE.Vector3();
        let startQuaternion = new THREE.Quaternion();
        let targetQuaternion = new THREE.Quaternion();

        // Seguimiento del mouse en coordenadas 3D
        let mouse = new THREE.Vector2();
        let raycaster = new THREE.Raycaster();
        let planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        let mouseWorldPos = new THREE.Vector3();

        init();
        animate();

        function init() {
            const container = document.getElementById('webgl-container');

            // Escena y Cámara
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0d0f12, 0.015);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 18);

            // Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            container.appendChild(renderer.domElement);

            // Luces profesionales
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x38bdf8, 3);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xf43f5e, 2, 50);
            pointLight.position.set(-10, -10, 10);
            scene.add(pointLight);

            // Cargar modelo automático apuntando a scene.gltf
            loadModel('scene.gltf');

            // Eventos del navegador
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onClick);

            // Selector manual por si se quiere cargar otro archivo localmente
            document.getElementById('fileInput').addEventListener('change', handleFileSelect);
        }

        function loadModel(url) {
            const loader = new GLTFLoader();
            loader.load(url, (gltf) => {
                if (model) scene.remove(model);
                
                model = gltf.scene;
                scene.add(model);

                // Centrar y escalar automáticamente
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                model.scale.multiplyScalar(4 / maxDim);
                model.position.sub(center.multiplyScalar(4 / maxDim));

                // Configurar animaciones (aleteo/hover)
                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    gltf.animations.forEach((clip) => {
                        const action = mixer.clipAction(clip);
                        action.play();
                    });
                }
            }, undefined, (error) => {
                console.log("Error cargando el modelo automáticamente.");
            });
        }

        function handleFileSelect(event) {
            const files = event.target.files;
            if (files.length === 0) return;

            let gltfFile = null;
            const fileMap = {};

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                fileMap[file.name] = URL.createObjectURL(file);
                if (file.name.endsWith('.gltf') || file.name.endsWith('.glb')) {
                    gltfFile = file;
                }
            }

            if (gltfFile) {
                const manager = new THREE.LoadingManager();
                manager.setURLModifier((url) => {
                    const filename = url.split('/').pop();
                    return fileMap[filename] || url;
                });

                const loader = new GLTFLoader(manager);
                loader.load(fileMap[gltfFile.name], (gltf) => {
                    if (model) scene.remove(model);
                    model = gltf.scene;
                    scene.add(model);

                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    model.scale.multiplyScalar(4 / maxDim);
                    model.position.sub(center.multiplyScalar(4 / maxDim));

                    if (gltf.animations && gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(model);
                        gltf.animations.forEach(clip => mixer.clipAction(clip).play());
                    }
                });
            }
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            raycaster.ray.intersectPlane(planeZ, mouseWorldPos);
        }

        function onClick() {
            if (!model || isSpinning) return;

            // Iniciar giro de 360° en un eje aleatorio tridimensional
            isSpinning = true;
            spinProgress = 0;
            startQuaternion.copy(model.quaternion);

            // Generar eje aleatorio para el giro 360
            spinAxis.set(
                (Math.random() - 0.5),
                (Math.random() - 0.5),
                (Math.random() - 0.5)
            ).normalize();

            let randomAngle = Math.PI * 2;
            let extraRot = new THREE.Quaternion().setFromAxisAngle(spinAxis, randomAngle);
            targetQuaternion.copy(startQuaternion).multiply(extraRot);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            if (model) {
                flightTime += delta * 0.8;

                // 1. Patrón de vuelo fluido por toda la página
                targetPosition.x = Math.sin(flightTime * 0.7) * 5;
                targetPosition.y = Math.cos(flightTime * 0.5) * 3;
                targetPosition.z = Math.sin(flightTime * 0.3) * 2;

                if (!isSpinning) {
                    model.position.lerp(targetPosition, 0.05);

                    // 2. Seguimiento del cursor con la mirada / cabeza
                    let lookTarget = new THREE.Vector3(
                        mouseWorldPos.x * 0.6,
                        mouseWorldPos.y * 0.6,
                        model.position.z + 2
                    );
                    model.lookAt(lookTarget);
                } else {
                    // 3. Ejecutar giro de 360° fluido tras hacer clic
                    spinProgress += delta * 4; // Velocidad del giro
                    if (spinProgress >= 1) {
                        spinProgress = 1;
                        isSpinning = false;
                    }
                    model.quaternion.slerpQuaternions(startQuaternion, targetQuaternion, spinProgress);
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
