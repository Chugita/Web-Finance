<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo 3D Interactivo - Vuelo y Seguimiento</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0f12;
            font-family: sans-serif;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        .ui-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.8);
            padding: 12px 24px;
            border-radius: 30px;
            color: #f8fafc;
            font-size: 14px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }
    </style>

    <!-- Carga directa y segura de Three.js y GLTFLoader global -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="webgl-container"></div>

    <div class="ui-overlay">
        <span>✨ Mueve el cursor para que te siga</span>
        <span>•</span>
        <span>🖱️ Haz clic para giro 360° aleatorio</span>
    </div>

    <script>
        let scene, camera, renderer, model, mixer;
        let clock = new THREE.Clock();
        
        let flightTime = 0;
        let targetPosition = new THREE.Vector3();
        
        let isSpinning = false;
        let spinProgress = 0;
        let spinAxis = new THREE.Vector3();
        let startQuaternion = new THREE.Quaternion();
        let targetQuaternion = new THREE.Quaternion();

        let mouse = new THREE.Vector2();
        let raycaster = new THREE.Raycaster();
        let planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        let mouseWorldPos = new THREE.Vector3();

        init();
        animate();

        function init() {
            const container = document.getElementById('webgl-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0d0f12, 0.01);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            // Luces de la escena
            const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
            scene.add(ambientLight);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2.0);
            hemiLight.position.set(0, 50, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0x38bdf8, 2.5);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);

            // Intentar cargar el modelo scene.gltf
            loadModel();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onClick);
        }

        function loadModel() {
            const loader = new THREE.GLTFLoader();

            loader.load('./scene.gltf', function (gltf) {
                model = gltf.scene;
                scene.add(model);

                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if (child.material) child.material.side = THREE.DoubleSide;
                    }
                });

                // Escalar y centrar
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                
                if (maxDim > 0) {
                    model.scale.multiplyScalar(4 / maxDim);
                }
                model.position.sub(center);

                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
                }
            }, undefined, function (error) {
                console.warn("Fallo al cargar scene.gltf, generando figura interactiva:", error);
                createFallbackShape();
            });
        }

        function createFallbackShape() {
            // Figura geométrica 3D interactiva garantizada si el GLTF antiguo falla por compatibilidad
            const geometry = new THREE.IcosahedronGeometry(2.5, 1);
            const textureLoader = new THREE.TextureLoader();
            
            const material = new THREE.MeshStandardMaterial({
                color: 0x38bdf8,
                roughness: 0.2,
                metalness: 0.8,
                wireframe: true
            });

            // Si existe la textura diffuse la aplicamos
            textureLoader.load('./material_0_diffuse.png', (tex) => {
                material.map = tex;
                material.wireframe = false;
                material.needsUpdate = true;
            });

            model = new THREE.Mesh(geometry, material);
            scene.add(model);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            raycaster.ray.intersectPlane(planeZ, mouseWorldPos);
        }

        function onClick() {
            if (!model || isSpinning) return;

            isSpinning = true;
            spinProgress = 0;
            startQuaternion.copy(model.quaternion);

            spinAxis.set(
                (Math.random() - 0.5),
                (Math.random() - 0.5),
                (Math.random() - 0.5)
            ).normalize();

            let randomAngle = Math.PI * 2;
            let extraRot = new THREE.Quaternion().setFromAxisAngle(spinAxis, randomAngle);
            targetQuaternion.copy(startQuaternion).multiply(extraRot);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            if (model) {
                flightTime += delta * 0.8;

                targetPosition.x = Math.sin(flightTime * 0.7) * 4;
                targetPosition.y = Math.cos(flightTime * 0.5) * 2.5;
                targetPosition.z = Math.sin(flightTime * 0.3) * 1.5;

                if (!isSpinning) {
                    model.position.lerp(targetPosition, 0.05);

                    let lookTarget = new THREE.Vector3(
                        mouseWorldPos.x * 0.5,
                        mouseWorldPos.y * 0.5,
                        model.position.z + 2
                    );
                    model.lookAt(lookTarget);
                } else {
                    spinProgress += delta * 4;
                    if (spinProgress >= 1) {
                        spinProgress = 1;
                        isSpinning = false;
                    }
                    model.quaternion.slerpQuaternions(startQuaternion, targetQuaternion, spinProgress);
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
