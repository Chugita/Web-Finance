<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo 3D Interactivo - Vuelo y Seguimiento</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0f12;
            font-family: sans-serif;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        .ui-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.8);
            padding: 12px 24px;
            border-radius: 30px;
            color: #f8fafc;
            font-size: 14px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .loading-text {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.9);
            padding: 10px 18px;
            border-radius: 12px;
            color: #38bdf8;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="loading-text" id="statusText">Cargando modelo 3D...</div>

    <div id="webgl-container"></div>

    <div class="ui-overlay">
        <span>✨ Mueve el cursor para que te siga</span>
        <span>•</span>
        <span>🖱️ Haz clic para giro 360° aleatorio</span>
    </div>

    <!-- Importamos Three.js y los módulos necesarios mediante ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, model, mixer;
        let clock = new THREE.Clock();
        
        // Variables para el movimiento de vuelo y comportamiento
        let flightTime = 0;
        let targetPosition = new THREE.Vector3();
        
        // Control de giro de 360° por clics
        let isSpinning = false;
        let spinProgress = 0;
        let spinAxis = new THREE.Vector3();
        let startQuaternion = new THREE.Quaternion();
        let targetQuaternion = new THREE.Quaternion();

        // Seguimiento del mouse en coordenadas 3D
        let mouse = new THREE.Vector2();
        let raycaster = new THREE.Raycaster();
        let planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        let mouseWorldPos = new THREE.Vector3();

        init();
        animate();

        function init() {
            const container = document.getElementById('webgl-container');

            // Escena y Cámara con rango amplio para evitar recortes
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0d0f12, 0.01);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 0, 15);

            // Renderizador con alta calidad de color
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            // Iluminación envolvente de estudio (ilumina desde todas las direcciones para que no quede totalmente negro)
            const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
            scene.add(ambientLight);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2.5);
            hemiLight.position.set(0, 50, 0);
            scene.add(hemiLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 3.0);
            dirLight1.position.set(20, 40, 20);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0x38bdf8, 2.0);
            dirLight2.position.set(-20, -20, -20);
            scene.add(dirLight2);

            // Carga automática del modelo scene.gltf
            loadModel('./scene.gltf');

            // Eventos del navegador
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onClick);
        }

        function loadModel(url) {
            const loader = new GLTFLoader();
            const statusEl = document.getElementById('statusText');

            loader.load(url, (gltf) => {
                if (model) scene.remove(model);
                
                model = gltf.scene;
                scene.add(model);

                // Ocultar cartel de carga al tener éxito
                statusEl.style.display = 'none';

                // Forzar la visibilidad de todos los materiales y corregir caras oscuras
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if (child.material) {
                            child.material.side = THREE.DoubleSide; // Evita que desaparezcan partes si las mallas están invertidas
                        }
                    }
                });

                // Centrar y escalar automáticamente el modelo a un tamaño estándar visible (ej. tamaño 4)
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                
                if (maxDim > 0) {
                    const scaleFactor = 5 / maxDim;
                    model.scale.multiplyScalar(scaleFactor);
                }
                model.position.sub(center);

                // Configurar animaciones si el modelo las incluye
                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    gltf.animations.forEach((clip) => {
                        const action = mixer.clipAction(clip);
                        action.play();
                    });
                }
            }, (xhr) => {
                // Progreso de carga opcional
                if (xhr.total > 0) {
                    let percent = Math.floor((xhr.loaded / xhr.total) * 100);
                    statusEl.innerText = `Cargando modelo... ${percent}%`;
                }
            }, (error) => {
                console.error("Error detallado al cargar el modelo 3D:", error);
                statusEl.innerText = "Error al cargar scene.gltf (ver consola)";
                statusEl.style.color = "#f43f5e";
            });
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            raycaster.ray.intersectPlane(planeZ, mouseWorldPos);
        }

        function onClick() {
            if (!model || isSpinning) return;

            // Iniciar giro de 360° en un eje aleatorio tridimensional
            isSpinning = true;
            spinProgress = 0;
            startQuaternion.copy(model.quaternion);

            spinAxis.set(
                (Math.random() - 0.5),
                (Math.random() - 0.5),
                (Math.random() - 0.5)
            ).normalize();

            let randomAngle = Math.PI * 2;
            let extraRot = new THREE.Quaternion().setFromAxisAngle(spinAxis, randomAngle);
            targetQuaternion.copy(startQuaternion).multiply(extraRot);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            if (model) {
                flightTime += delta * 0.8;

                // Patrón de vuelo fluido
                targetPosition.x = Math.sin(flightTime * 0.7) * 4;
                targetPosition.y = Math.cos(flightTime * 0.5) * 2.5;
                targetPosition.z = Math.sin(flightTime * 0.3) * 1.5;

                if (!isSpinning) {
                    model.position.lerp(targetPosition, 0.05);

                    // Seguimiento del cursor con la mirada
                    let lookTarget = new THREE.Vector3(
                        mouseWorldPos.x * 0.5,
                        mouseWorldPos.y * 0.5,
                        model.position.z + 2
                    );
                    model.lookAt(lookTarget);
                } else {
                    // Ejecutar giro de 360° fluido
                    spinProgress += delta * 4;
                    if (spinProgress >= 1) {
                        spinProgress = 1;
                        isSpinning = false;
                    }
                    model.quaternion.slerpQuaternions(startQuaternion, targetQuaternion, spinProgress);
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
